<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Movana">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e1b4b" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g filter="url(#soft)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Flowing M — movement + instructor flow -->
    <path
      d="M 148 368 V 196 C 148 168 168 148 196 148 C 220 148 238 162 248 182 L 256 198 L 264 182 C 274 162 292 148 316 148 C 344 148 364 168 364 196 V 368"
      stroke="url(#mark)"
      stroke-width="36"
    />
    <!-- Motion arc -->
    <path
      d="M 128 392 C 196 356 316 356 384 392"
      stroke="rgba(255,255,255,0.42)"
      stroke-width="14"
    />
  </g>
</svg>
